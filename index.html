<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a18">
<title>Mission (Im)Possible IP-Team</title>
<style>
:root{
  --ink:#151412;--ink2:#1e1c19;--ink3:#272420;
  --paper:#f7f4ee;--paper2:#f0ede6;
  --gold:#d4941a;--gold-l:#f5dfa0;--gold-d:#7a5508;
  --moss:#2e6b3e;--moss-l:#c8e6d0;
  --brick:#c0422a;--brick-l:#f7d8d2;
  --pink:#b85c96;--pink-l:#f5ddef;
  --mist:#9a9690;--line:#e0dbd0;
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--ink);color:var(--paper);overflow:hidden}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.active{display:flex}

/* INTRO */
#s-intro{
  background:var(--ink);align-items:center;justify-content:flex-start;
  text-align:center;padding:0;gap:0;overflow-y:auto;
  position:relative;
}
.intro-hero{
  width:100%;background:var(--ink2);
  padding:3rem 1.5rem 2.5rem;
  display:flex;flex-direction:column;align-items:center;gap:.75rem;
  border-bottom-left-radius:32px;border-bottom-right-radius:32px;
  margin-bottom:1.75rem;
  border-bottom:none;
}
.intro-logo{
  width:64px;height:64px;border-radius:20px;
  background:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:2rem;margin-bottom:.25rem;
}
#s-intro h1{font-size:2.6rem;line-height:1.05;letter-spacing:-.04em;font-weight:700}
#s-intro h1 em{color:var(--gold);font-style:normal;display:block}
.intro-meta{color:var(--mist);font-size:.82rem;letter-spacing:.02em}
.intro-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:1rem;padding:0 1.5rem;}
.field-block{display:flex;flex-direction:column;gap:.4rem}
.field-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mist);font-weight:600}
.field-inp{
  background:var(--ink2);border:1.5px solid #3a3630;border-radius:var(--r);
  color:var(--paper);font-size:1rem;padding:.9rem 1.1rem;
  font-family:inherit;outline:none;width:100%;transition:border-color .2s;
}
.field-inp:focus{border-color:var(--gold)}
.field-inp::placeholder{color:#5a5650}
.btn-start{
  background:var(--gold);color:#1a1200;border:none;border-radius:var(--r);
  padding:1rem 2rem;font-size:1rem;font-family:inherit;font-weight:700;
  cursor:pointer;width:100%;letter-spacing:.01em;
  transition:opacity .15s,transform .1s;
}
.btn-start:active{opacity:.88;transform:scale(.98)}


/* HUNT HEADER */
#s-hunt{background:var(--paper);color:var(--ink)}
.hunt-hdr{background:var(--ink);flex-shrink:0;z-index:20}
.hunt-top{
  padding:.85rem 1.1rem .7rem;
  display:flex;align-items:center;justify-content:space-between;
}
.ht-l .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mist);font-weight:600}
.ht-l .team{font-size:.92rem;color:var(--gold);font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-chip{
  background:var(--gold);color:#1a1200;
  border-radius:99px;padding:.32rem 1rem;
  font-size:.82rem;font-weight:700;letter-spacing:.02em;
}
.test-bar{background:#1f1800;border-bottom:1px solid #4a3800;padding:.5rem 1.1rem;display:none;align-items:center;gap:.6rem}
.test-bar.on{display:flex}
.test-bar-lbl{font-size:.72rem;color:var(--gold);font-weight:700;flex:1}
.btn-sim{background:var(--gold);color:#1a1200;border:none;border-radius:var(--rs);padding:.45rem 1rem;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-sim:active{opacity:.8}
.btn-exit{background:transparent;border:1px solid #4a4640;color:var(--mist);border-radius:var(--rs);padding:.4rem .7rem;font-size:.7rem;cursor:pointer}
.prog-rail{height:3px;background:#2a2620}
.prog-fill{height:100%;background:var(--gold);transition:width .5s ease;border-radius:0 99px 99px 0}
.hunt-scroll{flex:1;overflow-y:auto;padding-bottom:1.5rem}

/* COMPASS */
.compass-wrap{padding:1rem 1rem .6rem}
.compass-card{
  background:var(--ink);border-radius:20px;padding:1.1rem 1.2rem;
  display:flex;align-items:center;gap:1.1rem;border:1px solid #2e2a26;
}
.compass-card.warm{border-color:#c9922a55}
.compass-card.hot{border-color:var(--brick);animation:hotring 1.2s infinite}
@keyframes hotring{0%,100%{box-shadow:0 0 0 0 rgba(192,66,42,.3)}50%{box-shadow:0 0 0 10px rgba(192,66,42,0)}}
.c-dial{
  width:58px;height:58px;border-radius:50%;
  background:#0e0c0a;border:2px solid #333;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.c-info{flex:1;min-width:0}
.c-dest{font-size:.7rem;color:var(--mist);margin-bottom:.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.c-dest strong{color:var(--paper);text-transform:none;letter-spacing:0}
.c-dist{font-size:2rem;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-.03em}
.compass-card.warm .c-dist{color:#e0a030}
.compass-card.hot .c-dist{color:var(--brick)}
.c-temp{font-size:.72rem;margin-top:.3rem;color:var(--mist);font-weight:500}
.c-temp.warm{color:#e0a030}
.c-temp.hot{color:var(--brick);font-weight:700}
.c-temp.here{color:var(--moss);font-weight:700}

/* LOCKED */
.locked-card{
  margin:0 1rem 1rem;background:white;border-radius:20px;
  border:1.5px solid var(--line);padding:2rem 1.5rem;text-align:center;
}
.locked-card .li{font-size:2.5rem;margin-bottom:.75rem}
.locked-card h3{font-size:1.05rem;font-weight:700;margin-bottom:.5rem;color:var(--ink)}
.locked-card p{font-size:.85rem;color:var(--mist);line-height:1.65}

/* STOP CARD */
.stop-card{margin:0 1rem 1rem;background:white;border-radius:20px;border:2px solid var(--gold);overflow:hidden}
.stop-card.cava{border-color:var(--pink)}
.stop-card.fin{border-color:var(--moss)}
.stop-head{padding:1rem 1.1rem;display:flex;align-items:center;gap:.75rem;border-bottom:1.5px solid var(--line)}
.stop-num{
  width:36px;height:36px;border-radius:12px;flex-shrink:0;
  background:var(--gold);color:#1a1200;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;
}
.cava .stop-num{background:var(--pink);color:white}
.fin .stop-num{background:var(--moss);color:white}
.stop-title{font-size:1rem;font-weight:700;flex:1;color:var(--ink)}
.stop-badge{
  font-size:.67rem;border-radius:99px;padding:.22rem .65rem;
  font-weight:700;white-space:nowrap;background:var(--gold-l);color:var(--gold-d);
  letter-spacing:.02em;
}
.cava .stop-badge{background:var(--pink-l);color:#6a2060}
.fin .stop-badge{background:var(--moss-l);color:#1a5028}
.tab-bar{display:flex;background:var(--paper2);border-bottom:1.5px solid var(--line)}
.tab-btn{
  flex:1;padding:.7rem .3rem;border:none;background:none;
  font-size:.72rem;color:var(--mist);cursor:pointer;font-weight:600;
  border-bottom:2.5px solid transparent;margin-bottom:-1.5px;
  transition:color .15s,border-color .15s;letter-spacing:.02em;
}
.tab-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.cava .tab-btn.on{color:var(--pink);border-bottom-color:var(--pink)}
.fin .tab-btn.on{color:var(--moss);border-bottom-color:var(--moss)}
.tab-pane{display:none;padding:1rem 1.1rem}
.tab-pane.on{display:block}
.ibox{border-left:3px solid;border-radius:0 var(--rs) var(--rs) 0;padding:.9rem 1rem;font-size:.9rem;line-height:1.75}
.ibox .blbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:.4rem}
.weetje{background:var(--moss-l);border-color:var(--moss);color:#1a3820}
.weetje .blbl{color:var(--moss)}
.clue{background:var(--brick-l);border-color:var(--brick);color:#3a1008;font-style:italic}
.clue .blbl{color:var(--brick);font-style:normal}
.quiz-q{font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:1rem;color:var(--ink)}
.quiz-opts{display:flex;flex-direction:column;gap:.5rem}
.qopt{
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:.8rem 1rem;font-size:.88rem;cursor:pointer;text-align:left;
  font-family:inherit;color:var(--ink);transition:all .15s;font-weight:500;
}
.qopt:not(:disabled):hover{border-color:var(--gold);background:var(--gold-l)}
.qopt.ok{background:var(--moss-l);border-color:var(--moss);color:#1a3820;pointer-events:none}
.qopt.nok{background:var(--brick-l);border-color:var(--brick);color:#3a1008;pointer-events:none}
.qopt:disabled{pointer-events:none;opacity:.65}
.qfb{font-size:.85rem;font-weight:700;text-align:center;margin-top:.75rem;padding:.6rem;border-radius:var(--rs)}
.qfb.ok{color:#1a3820;background:var(--moss-l)}
.qfb.nok{color:#3a1008;background:var(--brick-l)}
.q-done{text-align:center;color:var(--moss);font-family:sans-serif;font-size:.88rem;font-weight:600;padding:.5rem 0}
.btn-fin{width:100%;margin-top:1rem;background:var(--moss);color:white;border:none;border-radius:var(--r);padding:1rem;font-size:1rem;font-family:Georgia,serif;font-weight:bold;cursor:pointer}
.btn-fin:active{opacity:.85}

/* FINISH */
#s-finish{
  background:var(--ink);align-items:center;justify-content:center;
  text-align:center;padding:0;overflow-y:auto;
}
.fin-hero{
  width:100%;background:var(--ink2);
  padding:3.5rem 1.5rem 2.5rem;
  border-bottom-left-radius:32px;border-bottom-right-radius:32px;
  margin-bottom:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;
}
.fin-trophy{font-size:4rem}
#s-finish h2{font-size:2.4rem;font-weight:700;color:var(--gold);letter-spacing:-.03em}
.fin-pos{font-size:1.3rem;font-weight:700;color:var(--paper);margin-bottom:.25rem;letter-spacing:-.01em}
.fin-pts{font-size:5rem;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-.04em}
.fin-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mist);font-weight:600}
#s-finish p{color:var(--mist);line-height:1.65;max-width:280px;font-size:.9rem;padding:0 1.5rem}

/* GPS PILL */
.gps-pill{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink2);border:1px solid #3a3630;border-radius:99px;padding:.4rem 1.1rem;font-size:.7rem;color:var(--mist);display:none;z-index:50;white-space:nowrap;font-weight:500}
.gps-pill.on{display:block}
.gdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#555;margin-right:5px;vertical-align:middle}
.gdot.on{background:#4caf50;animation:bl 2s infinite}
.gdot.srch{background:var(--gold);animation:bl .8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}

/* TOAST */
.toast{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%) translateY(-130%);background:var(--ink2);color:var(--paper);border:1.5px solid var(--gold);border-radius:99px;padding:.65rem 1.5rem;font-size:.83rem;white-space:nowrap;transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:200;max-width:90vw;text-align:center;font-weight:600}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- INTRO -->
<div id="s-intro" class="screen active">
  <div class="intro-hero">
    <div class="intro-logo">🗺️</div>
    <h1 id="h1">Schattenjacht<br><em>Gent</em></h1>
    <p class="intro-meta" id="imeta"></p>
  </div>
  <div class="intro-form">
    <div id="resume-block" style="display:none;background:#1e1c19;border:1.5px solid #c9922a;border-radius:16px;padding:.9rem 1.1rem;text-align:left;cursor:pointer" onclick="resumeSession()">
      <div style="font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#9a9690;font-weight:600;margin-bottom:.3rem">Sessie hervatten</div>
      <div style="font-size:1rem;font-weight:700;color:#f7f4ee" id="resume-team">—</div>
      <div style="font-size:.78rem;color:#d4941a;margin-top:.2rem" id="resume-info">—</div>
      <div style="font-size:.72rem;color:#9a9690;margin-top:.5rem">Tik om verder te gaan →</div>
    </div>
    <div class="field-block">
      <div class="field-lbl">Of start nieuw team</div>
      <input class="field-inp" id="inp" type="text" placeholder="bv. Team Gravensteen" maxlength="24" autocomplete="off">
    </div>
    <button class="btn-start" onclick="go(false)">Start de jacht &rarr;</button>

  </div>
</div>

<!-- HUNT -->
<div id="s-hunt" class="screen">
  <div class="hunt-hdr">
    <div class="hunt-top">
      <div class="ht-l">
        <div class="lbl">Team</div>
        <div class="team" id="ht-team">—</div>
      </div>
      <div class="score-chip">⭐ <span id="ht-score">0</span></div>
    </div>
    <div class="test-bar" id="test-bar">
      <div class="test-bar-lbl">🧪 Testmodus actief</div>
      <button class="btn-sim" onclick="simStep()">📍 Simuleer stop</button>
      <button class="btn-exit" onclick="exitTest()">✕ Echt GPS</button>
    </div>
    <div class="prog-rail"><div class="prog-fill" id="prog"></div></div>
  </div>
  <div class="hunt-scroll" id="hscroll"></div>
</div>

<!-- FINISH -->
<div id="s-finish" class="screen">
  <div class="fin-hero">
    <div class="fin-trophy">🏆</div>
    <h2>Finish!</h2>
    <div class="fin-pos" id="fpos">🎉 Proficiat!</div>
    <div class="fin-pts" id="fpts">0</div>
    <div class="fin-lbl">punten gescoord</div>
  </div>
  <p id="fmsg">Welkom aan de Multatuli!</p>
</div>

<div class="toast" id="toast"></div>
<div class="gps-pill on" id="gpill"><span class="gdot srch" id="gdot"></span><span id="gtxt">GPS zoeken…</span></div>

<script src="data.js"></script>
<script>
const S={team:'',score:0,pos:null,heading:null,idx:0,quizDone:new Set(),tab:{},test:false};

// boot
document.getElementById('h1').innerHTML='Schattenjacht<br><em>'+CONFIG.title.split(' ').slice(1).join(' ')+'</em>';

// check for existing session on load
(function(){
  try{
    const d=localStorage.getItem('sj_session');
    if(!d)return;
    const p=JSON.parse(d);
    if(!p.team)return;
    const stop=STOPS[Math.min(p.idx||0, STOPS.length-1)];
    const block=document.getElementById('resume-block');
    if(block){
      block.style.display='block';
      document.getElementById('resume-team').textContent=p.team;
      document.getElementById('resume-info').textContent=`Stop ${(p.idx||0)+1}/${STOPS.length} · ${stop.emoji} ${stop.name} · ⭐ ${p.score||0} punten`;
    }
  }catch(e){}
})();
document.getElementById('imeta').textContent=CONFIG.subtitle+' · '+CONFIG.date;
document.getElementById('inp').onkeydown=e=>{if(e.key==='Enter')go(false)};
// testmodus via URL: voeg ?test toe aan de URL (alleen voor organisator)
if(window.location.search.includes('test')){
  const tb=document.createElement('div');
  tb.style.cssText='width:100%;max-width:300px;background:#1e1c19;border:1.5px dashed #4a4640;border-radius:16px;padding:.9rem 1.1rem;text-align:center;cursor:pointer;margin-top:.5rem';
  tb.innerHTML='<div style="font-size:.85rem;color:#f7f4ee;font-weight:600">🧪 Testmodus</div><div style="font-size:.73rem;color:#9a9690">Simuleer GPS-stops</div>';
  tb.onclick=()=>go(true);
  document.querySelector('.intro-form').appendChild(tb);
}

function resumeSession(){
  try{
    const d=localStorage.getItem('sj_session');
    if(!d)return;
    const p=JSON.parse(d);
    S.team=p.team;S.score=p.score||0;S.idx=p.idx||0;S.test=p.test||false;
    S.quizDone=new Set(p.quizDone||[]);
    document.getElementById('ht-team').textContent=S.team;
    document.getElementById('ht-score').textContent=S.score;
    if(S.test)document.getElementById('test-bar').classList.add('on');
    showScreen('hunt');render();initFB();
    if(!S.test)startGPS();
    saveSession();
  toast(`👋 Welkom terug ${S.team}!`);
  }catch(e){toast('Kon sessie niet herstellen')}
}

function go(testMode){
  const n=document.getElementById('inp').value.trim()||(testMode?'Testteam':'');
  if(!n){toast('Vul eerst een teamnaam in 👆');return}
  if(testMode&&!document.getElementById('inp').value.trim())document.getElementById('inp').value='Testteam';
  S.team=n;S.test=testMode;
  document.getElementById('ht-team').textContent=n;
  if(testMode)document.getElementById('test-bar').classList.add('on');
  saveSession();
  showScreen('hunt');render();initFB();
  if(!testMode)startGPS();
  else{document.getElementById('gtxt').textContent='Testmodus — geen echte GPS';document.getElementById('gdot').className='gdot srch'}
}

function exitTest(){S.test=false;document.getElementById('test-bar').classList.remove('on');startGPS();toast('GPS geactiveerd')}

// FIREBASE
function initFB(){
  if(!CONFIG.firebase.apiKey||CONFIG.firebase.apiKey==='JOUW_API_KEY')return;
  const s=document.createElement('script');s.type='module';
  s.textContent=`import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getDatabase,ref,set,onValue}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';const app=initializeApp(${JSON.stringify(CONFIG.firebase)});const db=getDatabase(app);window._fb=(p,v)=>set(ref(db,p),v);onValue(ref(db,'teams'),(snap)=>{window._fbData=snap.val();});`;
  document.head.appendChild(s);
}
let _lastPush=0;
function push(force=false){
  if(!window._fb)return;
  const now=Date.now();
  if(!force&&now-_lastPush<5000)return;
  _lastPush=now;
  const st=STOPS[S.idx];
  const k='teams/'+S.team.replace(/[^a-zA-Z0-9]/g,'_');
  let distNext=null;
  if(S.pos&&st){distNext=Math.round(dist(S.pos.lat,S.pos.lng,st.lat,st.lng))}
  try{window._fb(k,{
    team:S.team,score:S.score,
    stopIdx:S.idx,stopName:st?.name||'—',stopEmoji:st?.emoji||'',
    lat:S.pos?.lat||null,lng:S.pos?.lng||null,
    distNext,
    finished:S.idx>=STOPS.length,
    ts:now
  })}catch(e){}
}

// RENDER
function render(){
  const sc=document.getElementById('hscroll');sc.innerHTML='';
  const st=STOPS[S.idx];if(!st)return;
  sc.appendChild(mkCompass(st));
  sc.appendChild(isOpen(st)?mkCard(st):mkLocked(st));
  document.getElementById('prog').style.width=(S.idx/STOPS.length*100)+'%';
  document.getElementById('ht-score').textContent=S.score;
}

function isOpen(st){
  if(S.test&&S.pos?.sim)return true;
  if(!S.pos)return false;
  return dist(S.pos.lat,S.pos.lng,st.lat,st.lng)<=CONFIG.unlockRadius;
}

function mkCompass(st){
  const w=document.createElement('div');w.className='compass-wrap';
  if(!S.pos){
    w.innerHTML=`<div class="compass-card"><div class="c-dial"><span class="c-arrow">🧭</span></div><div class="c-info"><div class="c-dest">Volgende stop: <strong>${st.emoji} ${st.name}</strong></div><div class="c-dist" style="font-size:1rem;color:var(--mist)">Wacht op GPS…</div></div></div>`;
    return w;
  }
  const d=dist(S.pos.lat,S.pos.lng,st.lat,st.lng);
  const b=brng(S.pos.lat,S.pos.lng,st.lat,st.lng);
  const rot=S.heading!=null?(b-S.heading+360)%360:b;
  const dm=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';
  let cls='',tc='',tt='❄️ Nog ver weg';
  if(d<CONFIG.compassActiveFrom*0.6){cls='warm';tc='warm';tt='🟡 Je komt er dichtbij…'}
  if(d<CONFIG.unlockRadius){cls='hot';tc='hot';tt='🔥 Je bent er!'}
  const nameHidden = !isOpen(st);
  const destLabel = nameHidden ? '🔒 Onbekend — volg de clue' : `${st.emoji} ${st.name}`;
  // Toon 8-richtingen kompas op basis van bearing (werkt altijd, ook zonder gyroscoop)
  const arrowColor = cls==='hot' ? '#b84c2b' : cls==='warm' ? '#e0a030' : '#c9922a';
  w.innerHTML=`<div class="compass-card ${cls}">
    <div class="c-dial">
      <svg width="36" height="36" viewBox="0 0 36 36" style="transform:rotate(${b}deg);transition:transform .4s ease" xmlns="http://www.w3.org/2000/svg">
        <polygon points="18,3 28,30 18,24 8,30" fill="${arrowColor}" opacity="1"/>
        <polygon points="18,3 8,30 18,24" fill="${arrowColor}" opacity="0.35"/>
      </svg>
    </div>
    <div class="c-info">
      <div class="c-dest">Volgende stop: <strong>${destLabel}</strong></div>
      <div class="c-dist">${dm}</div>
      <div class="c-temp ${tc}">${tt}</div>
    </div></div>`;
  return w;
}

function mkLocked(st){
  const d=document.createElement('div');d.className='locked-card';
  d.innerHTML=`<div class="li">🔒</div><h3>Onbekende stop</h3><p>Volg de clue en het kompas.<br>De stop onthult zich als je dichtbij genoeg bent.</p>`;
  return d;
}

function mkCard(st){
  const at=S.tab[st.id]||'weetje';const qd=S.quizDone.has(st.id);
  const card=document.createElement('div');
  card.className='stop-card'+(st.cava?' cava':'')+(st.finish?' fin':'');
  card.id='c'+st.id;
  let bdg=`Stop ${st.id}/${STOPS.length}`;
  if(st.cava)bdg='🥂 Verrassing!';
  if(st.finish)bdg='🏁 Finish';
  card.innerHTML=`<div class="stop-head"><div class="stop-num">${st.id}</div><div class="stop-title">${st.emoji} ${st.name}</div><div class="stop-badge">${bdg}</div></div>
<div class="tab-bar">
<button class="tab-btn${at==='weetje'?' on':''}" onclick="setTab(${st.id},'weetje',this)">💡 Weetje</button>
<button class="tab-btn${at==='clue'?' on':''}" onclick="setTab(${st.id},'clue',this)">🗺️ Clue</button>
<button class="tab-btn${at==='quiz'?' on':''}" onclick="setTab(${st.id},'quiz',this)">❓ Quiz${qd?' ✓':''}</button>
</div>
<div id="tw${st.id}" class="tab-pane${at==='weetje'?' on':''}"><div class="ibox weetje"><div class="blbl">Historisch weetje</div>${st.weetje}</div></div>
<div id="tc${st.id}" class="tab-pane${at==='clue'?' on':''}"><div class="ibox clue"><div class="blbl">🗺️ Volgende clue</div>${st.clue}</div>${st.finish?'<button class="btn-fin" onclick="doFinish()">🏁 Finish registreren</button>':''}</div>
<div id="tq${st.id}" class="tab-pane${at==='quiz'?' on':''}">${mkQuiz(st)}</div>`;
  return card;
}

function mkQuiz(st){
  if(S.quizDone.has(st.id))return'<div class="q-done">✓ Quiz al voltooid!</div>';
  return`<div class="quiz-q">${st.quiz.vraag}</div><div class="quiz-opts">${st.quiz.opties.map((o,i)=>`<button class="qopt" onclick="ans(${st.id},${i})">${o}</button>`).join('')}</div><div class="qfb" id="qf${st.id}"></div>`;
}

function setTab(id,t,btn){
  S.tab[id]=t;
  document.getElementById('c'+id)?.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('c'+id)?.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
  btn?.classList.add('on');
  document.getElementById('t'+t[0]+id)?.classList.add('on');
}

function ans(id,ch){
  if(S.quizDone.has(id))return;
  const st=STOPS.find(s=>s.id===id);
  const card=document.getElementById('c'+id);
  const btns=card?.querySelectorAll('.qopt');
  const fb=document.getElementById('qf'+id);
  if(!btns||!fb)return;
  btns.forEach(b=>b.disabled=true);
  const ok=ch===st.quiz.correct;
  btns[ch].classList.add(ok?'ok':'nok');
  if(!ok)btns[st.quiz.correct].classList.add('ok');
  fb.textContent=ok?`🎉 Correct! +${CONFIG.pointsQuiz} punten`:'✗ Jammer — geen punten';
  fb.className='qfb '+(ok?'ok':'nok');
  if(ok){addScore(CONFIG.pointsQuiz);toast(`🎉 Juist! +${CONFIG.pointsQuiz} punten`)}
  S.quizDone.add(id);addScore(CONFIG.pointsStop);push(true);
  setTimeout(()=>{
    S.idx=Math.min(S.idx+1,STOPS.length-1);
    if(S.pos)S.pos.sim=false;
    saveSession();
    render();document.getElementById('hscroll').scrollTo(0,0);
    const nx=STOPS[S.idx];if(nx)toast(`➡️ ${nx.emoji} ${nx.name}`);
  },2000);
}

function addScore(n){S.score+=n;document.getElementById('ht-score').textContent=S.score;saveSession()}
function saveSession(){
  try{localStorage.setItem('sj_session',JSON.stringify({team:S.team,score:S.score,idx:S.idx,test:S.test,quizDone:[...S.quizDone]}))}catch(e){}
}
function loadSession(){
  try{
    const d=localStorage.getItem('sj_session');
    if(!d)return false;
    const p=JSON.parse(d);
    if(!p.team)return false;
    S.team=p.team;S.score=p.score||0;S.idx=p.idx||0;S.test=p.test||false;
    S.quizDone=new Set(p.quizDone||[]);
    return true;
  }catch(e){return false}
}
function clearSession(){try{localStorage.removeItem('sj_session')}catch(e){}}

// GPS
function startGPS(){
  document.getElementById('gpill').classList.add('on');
  if(!navigator.geolocation){document.getElementById('gtxt').textContent='GPS niet beschikbaar';return}
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,timeout:15000,maximumAge:3000});
  if(window.DeviceOrientationEvent){
    window.addEventListener('deviceorientationabsolute',onOri,true);
    window.addEventListener('deviceorientation',onOri,true);
  }
}
function onPos(p){
  S.pos={lat:p.coords.latitude,lng:p.coords.longitude,sim:false};
  const ac=Math.round(p.coords.accuracy);
  document.getElementById('gdot').className='gdot on';
  document.getElementById('gtxt').textContent=`GPS ±${ac}m`;
  render();push();
}
function onErr(){document.getElementById('gdot').className='gdot';document.getElementById('gtxt').textContent='GPS fout — gebruik testmodus'}
function onOri(e){const h=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?360-e.alpha:null);if(h!=null)S.heading=h}

// SIMULATE
function simStep(){
  const st=STOPS[S.idx];if(!st){toast('Alle stops gesimuleerd!');return}
  S.pos={lat:st.lat+(Math.random()-.5)*.0002,lng:st.lng+(Math.random()-.5)*.0002,sim:true};
  document.getElementById('gdot').className='gdot on';
  document.getElementById('gtxt').textContent=`🧪 ${st.name}`;
  render();toast(`📍 Ontgrendeld: ${st.emoji} ${st.name}`);push();
}

// FINISH
async function doFinish(){
  clearSession();
  // tel hoeveel teams al gefinished zijn via Firebase
  let pos = 1;
  try {
    if(window._fb && window._fbData) {
      const all = Object.values(window._fbData || {});
      pos = all.filter(t => t.finished && t.team !== S.team).length + 1;
    }
  } catch(e) {}
  // push als finished
  S.idx = STOPS.length;
  push(true);
  // toon finish scherm
  document.getElementById('fpts').textContent = S.score;
  // podium boodschap
  const medals = ['🥇','🥈','🥉'];
  const medal = medals[pos-1] || '🎉';
  const posMsg = pos === 1
    ? `${medal} Jullie zijn de eersten! Proficiat!`
    : pos === 2
    ? `${medal} Tweede plaats! Goed gedaan!`
    : pos === 3
    ? `${medal} Derde plaats! Knap!`
    : `${medal} Plaats ${pos} — goed gepresteerd!`;
  document.getElementById('fpos').textContent = posMsg;
  document.getElementById('fmsg').textContent = `${S.team} · ${S.score} punten · Welkom aan de Multatuli! 🥂`;
  showScreen('finish');
}

// GEO
function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180,e=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e))}
function brng(a,b,c,d){const dO=(d-b)*Math.PI/180,y=Math.sin(dO)*Math.cos(c*Math.PI/180),x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dO);return(Math.atan2(y,x)*180/Math.PI+360)%360}

// UI
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s-'+id).classList.add('active')}
let _tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),3000)}
</script>
</body>
</html>
